name: Apply 400C web branding
on:
  push:
    paths:
      - '.github/workflows/brand-400c.yml'
permissions:
  contents: write
jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update visible web branding and gzip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main/web/ota.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('SAFEX · 设备管理', '400C · 设备管理')
          s = s.replace('<div class="logo-icon">S</div>', '<div class="logo-icon">4</div>')
          s = s.replace('<span class="brand-name">SAFEX</span>', '<span class="brand-name">400C</span>')
          s = s.replace('SAFEX Air8000 · Portable Chemical Detector · 2026', '400C Air8000 · Portable Chemical Detector · 2026')
          s = s.replace("log('SAFEX Web UI 已加载'", "log('400C Web UI 已加载'")
          p.write_text(s, encoding='utf-8')
          PY
          gzip -9 -c main/web/ota.html > main/web/ota.html.gz
          rm .github/workflows/brand-400c.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/web/ota.html main/web/ota.html.gz .github/workflows/brand-400c.yml
          git commit -m "style(web): rename SAFEX branding to 400C"
          git push
